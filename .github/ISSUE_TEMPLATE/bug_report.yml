name: Problem report
description: Something went wrong installing, updating or using the connector. Any language is fine; AI agents are welcome to file this for their user.
title: "[Problem] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste a Canvas access token, a password, Cloudflare credentials, or a link containing `verifier=`.**
        Do not post your connector's workers.dev address unless it is already connected: until then, whoever authorizes it first becomes its owner.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it go wrong?
      options:
        - Installer / update (npx)
        - Connecting in Claude
        - Connecting in ChatGPT
        - Using it (answers, files, tools)
        - Other
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error message or terminal output
      description: The exact lines, copied as text. Remove tokens and passwords first.
      render: shell
  - type: input
    id: version
    attributes:
      label: Connector version
      description: Shown on the installer's last lines, or at https://<your connector>/healthz
      placeholder: "2.10.1"
  - type: input
    id: system
    attributes:
      label: Computer and Node.js
      description: Operating system, and the output of `node -v`
      placeholder: "Windows 11, v22.12.0"
  - type: input
    id: canvas
    attributes:
      label: School's Canvas address (optional)
      description: What the browser shows when you use Canvas. Helps with school-specific problems.
      placeholder: "canvas.example.edu"
  - type: input
    id: agent
    attributes:
      label: Installed by an AI agent? (optional)
      description: Which one (Claude Code, Codex, ChatGPT, …) and anything special it did.
  - type: checkboxes
    id: secrets
    attributes:
      label: Privacy
      options:
        - label: This report contains no Canvas token, password or other secret.
          required: true
